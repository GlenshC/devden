<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevDen — Project Management for Developers</title>
    <base href="/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Fonts: Inter & Geist Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Geist+Mono:wght@100..900&display=swap" rel="stylesheet">

    <link href="css/app.css" rel="stylesheet" />
</head>

<body class="bg-ground text-fg antialiased selection:bg-coral/30 selection:text-fg min-h-screen overflow-x-hidden">
    <!-- Film grain SVG filter definition (hidden, referenced by CSS) -->
    <svg class="hidden" aria-hidden="true" width="0" height="0">
        <filter id="den-grain">
            <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
        </filter>
    </svg>

    <div id="app">
        <!-- Minimal loading state before Blazor WASM boots -->
        <div class="fixed inset-0 bg-[#07080a] flex flex-col items-center justify-center z-50">
            <div class="relative flex items-center justify-center mb-4">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-amber via-coral to-crimson animate-pulse opacity-80 blur-[2px]"></div>
                <div class="absolute w-10 h-10 rounded-lg bg-[#07080a] flex items-center justify-center border border-white/10">
                    <span class="font-mono font-bold text-transparent bg-clip-text bg-gradient-to-br from-amber to-crimson text-sm">DEN</span>
                </div>
            </div>
            <div class="text-xs font-mono text-muted tracking-widest uppercase animate-pulse">Initializing DevDen...</div>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden fixed bottom-4 right-4 z-50 bg-crimson/90 text-white px-4 py-2 rounded-lg text-sm shadow-xl backdrop-blur">
        An unhandled error has occurred.
        <a href="" class="underline ml-2">Reload</a>
        <a class="cursor-pointer ml-2 text-white/70" onclick="document.getElementById('blazor-error-ui').style.display='none'">✕</a>
    </div>

    <script src="js/den.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
